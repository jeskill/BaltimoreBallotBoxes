        <script>

        // HIGHLIGHT FEATURE
        var highlightLayer;
        function highlightFeature(e) {
             highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
               highlightLayer.setStyle({
                 color: 'rgba(255, 255, 0, 1.00)',
               });
             } else {
               highlightLayer.setStyle({
                 fillColor: 'rgba(255, 255, 0, 1.00)',
                 fillOpacity: 1
               });
             }
             highlightLayer.openPopup();
         }
        
        // RESET HIGHLIGHT
        function resetHighlight(e) {
            var layer = e.target;
            highlightLayer.setStyle({
                fillColor: 'rgba(72,123,182,0.97)',
                fillOpacity: 1
            })
        }

        // INITIATE MAP
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        })

        // CREAT ATTRIBUTION
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a> <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://s3.amazonaws.com/baltimorecity.gov.if-us-east-1/s3fs-public/2025-12/updated_ballot_drop_off_locations-2026.pdf">Baltimore City Drop Box Locations</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Ballot Box Locations in Baltimore City</h2>';
        };
        title.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        map.createPane('pane_OSMHumanitarianDataModel_0');

        var layer_OSMHumanitarianDataModel_0 = L.tileLayer('http://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            pane: 'pane_OSMHumanitarianDataModel_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
        });
        layer_OSMHumanitarianDataModel_0;
        map.addLayer(layer_OSMHumanitarianDataModel_0);

        // POP UP AND HIGHLIGHTER FUNCTIONALITY AND CONTENT

        function pop_BallotDropBoxes_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
                mouseout: resetHighlight
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Location Type</th>\
                        <td colspan="2">' + (feature.properties['Type'] !== null ? autolinker.link(String(feature.properties['Type']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Location Name</th>\
                        <td>' + (feature.properties['site name'] !== null ? autolinker.link(String(feature.properties['site name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Address</th>\
                        <td>' + (feature.properties['address'] !== null ? autolinker.link(String(feature.properties['address']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table><p>Are you registered to vote? Check here: https://voterservices.elections.maryland.gov/VoterSearch </p><p>Drop Boxes are open now until 8pm on November 3rd, 2026.</p><p>You can vote in person at Early Voting Sites from Thursday, October 22, 2026 through Thursday, October 29, 2026, 7 a.m. to 8 p.m.</p>'


            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }


        function style_BallotDropBoxes_1_0(feature) {
            switch(String(feature.properties['Type'])) {
                case 'Drop Box':
                    return {
                pane: 'pane_BallotDropBoxes_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,0.85)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(56,44,176,0.85)',
                interactive: true,
            }
                    break;
                case 'Drop Box/Early Voting':
                    return {
                pane: 'pane_BallotDropBoxes_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,0.85)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,0.85)',
                interactive: true,
            }
                    break;
                case 'Early Voting':
                    return {
                pane: 'pane_BallotDropBoxes_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,0.85)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,0.85)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_BallotDropBoxes_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(50,87,128,0.85)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(122,4,3,0.85)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_BallotDropBoxes_1');
        map.getPane('pane_BallotDropBoxes_1').style.zIndex = 401;
        map.getPane('pane_BallotDropBoxes_1').style['mix-blend-mode'] = 'normal';
        var layer_BallotDropBoxes_1 = new L.geoJson(json_BallotDropBoxes_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_BallotDropBoxes_1',
            layerName: 'layer_BallotDropBoxes_1',
            pane: 'pane_BallotDropBoxes_1',
            onEachFeature: pop_BallotDropBoxes_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_BallotDropBoxes_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_BallotDropBoxes_1);
        map.addLayer(layer_BallotDropBoxes_1);
        const url = {"Nominatim OSM": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&",
        "France BAN": "https://api-adresse.data.gouv.fr/search/?"}
        var photonControl = L.control.photon({
            url: url["Nominatim OSM"],
            feedbackLabel: '',
            position: 'topleft',
            includePosition: true,
            initial: true,
            // resultsHandler: myHandler,
        }).addTo(map);
        photonControl._container.childNodes[0].style.borderRadius="10px"
        // Create a variable to store the geoJSON data
        var x = null;
        // Create a variable to store the marker
        var marker = null;
        // Add an event listener to the Photon control to create a marker from the returned geoJSON data
        var z = null;
        photonControl.on('selected', function(e) {
            console.log(photonControl.search.resultsContainer);
            if (x != null) {
                map.removeLayer(obj3.marker);
                map.removeLayer(x);
            }
            obj2.gcd = e.choice;
            x = L.geoJSON(obj2.gcd).addTo(map);
            var label = typeof obj2.gcd.properties.label === 'undefined' ? obj2.gcd.properties.display_name : obj2.gcd.properties.label;

            z = typeof e.choice.properties.label === 'undefined'? e.choice.properties.display_name : e.choice.properties.label;
            console.log(e);
            e.target.input.value = z;
        });
        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        search.classList.add("leaflet-control-search")
        search.style.display = "flex";
        search.style.backgroundColor="rgba(255,255,255,0.5)" 

        // Create the new button element
        var button = document.createElement("div");
        button.id = "gcd-button-control";
        button.className = "gcd-gl-btn fa fa-search search-button";

        // Insert the button at the beginning of the search control
        search.insertBefore(button, search.firstChild);

            } else {
                last.style.display = "none";
            }
        });
        var overlaysTree = [
            {label: 'Ballot Drop Boxes<br /><table><tr><td style="text-align: center;"><img src="legend/BallotDropBoxes_1_DropBox0.png" /></td><td>Drop Box</td></tr><tr><td style="text-align: center;"><img src="legend/BallotDropBoxes_1_DropBoxEarlyVoting1.png" /></td><td>Drop Box/Early Voting</td></tr><tr><td style="text-align: center;"><img src="legend/BallotDropBoxes_1_EarlyVoting2.png" /></td><td>Early Voting</td></tr><tr><td style="text-align: center;"><img src="legend/BallotDropBoxes_1_3.png" /></td><td></td></tr></table>', layer: layer_BallotDropBoxes_1},            //{label: "OSM Humanitarian Data Model", layer: layer_OSMHumanitarianDataModel_0, radioGroup: 'bm' },
            ]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',

        lay.addTo(map);

        map.addControl(new L.Control.Search({

        if (typeof url === 'undefined') {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        } else {

        resetLabels([layer_BallotDropBoxes_1]);
